<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Games</title>

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: url('https://images.unsplash.com/photo-1518791841217-8f162f1e1131?auto=format&fit=crop&w=1600&q=80') center/cover fixed;
      color: #eee;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    h1 {
      margin-bottom: 25px;
      font-size: 42px;
      color: #fff;
      text-shadow: 0 0 12px #9d4dff, 0 0 22px #4CAF50;
    }

    #game-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 25px;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .game {
      background: rgba(20, 20, 20, 0.85);
      padding: 25px 15px;
      border-radius: 25px;
      border: 2px solid #4CAF50;
      box-shadow: 0 0 15px rgba(0,0,0,0.6), 0 0 10px #4CAF50 inset;
      transition: transform .2s ease, box-shadow .2s ease;
      position: relative;
    }

    .game::before,
    .game::after {
      content: "";
      position: absolute;
      top: -12px;
      width: 25px;
      height: 25px;
      background: #4CAF50;
      border-radius: 50% 50% 0 0;
    }

    .game::before {
      left: 25px;
      transform: rotate(-20deg);
    }

    .game::after {
      right: 25px;
      transform: rotate(20deg);
    }

    .game:hover {
      transform: translateY(-6px);
      box-shadow: 0 0 25px #4CAF50, 0 0 35px #9d4dff inset;
    }

    .game h2 {
      font-size: 20px;
      margin-bottom: 15px;
      word-wrap: break-word;
      line-height: 1.2;
      min-height: 48px;
      text-shadow: 0 0 8px #9d4dff;
    }

    .game a {
      padding: 10px 16px;
      background: #9d4dff;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
      display: inline-block;
      transition: background .15s ease, box-shadow .15s ease;
    }

    .game a:hover {
      background: #b67aff;
      box-shadow: 0 0 12px #b67aff;
    }

    #pagination {
      margin-top: 30px;
    }

    #pagination button {
      padding: 12px 20px;
      margin: 0 10px;
      background: rgba(0,0,0,0.7);
      color: #fff;
      border: 2px solid #9d4dff;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      transition: background .15s ease, box-shadow .15s ease;
    }

    #pagination button:hover {
      background: #9d4dff;
      box-shadow: 0 0 12px #9d4dff;
    }
  </style>
</head>

<body>
  <h1>My Games</h1>

  <div id="game-list">Loading games…</div>

  <div id="pagination"></div>

   <script src="games.js?v=2"></script>
</body>
</html>
