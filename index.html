<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Games</title>

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0d0d0d;
      color: #eee;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    h1 {
      margin-bottom: 25px;
      font-size: 36px;
      color: #fff;
      text-shadow: 0 0 10px #4CAF50;
    }

    /* Bubble grid */
    #game-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 25px;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Bubble card */
    .game {
      background: #1a1a1a;
      padding: 25px 15px;
      border-radius: 20px;
      box-shadow: 0 0 15px rgba(0,0,0,0.4);
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .game:hover {
      transform: translateY(-6px);
      box-shadow: 0 0 25px rgba(0,0,0,0.6);
    }

    .game h2 {
      font-size: 20px;
      margin-bottom: 15px;
      word-wrap: break-word;
      line-height: 1.2;
      min-height: 48px; /* keeps bubbles same height even with long names */
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .game a {
      padding: 10px 16px;
      background: #4CAF50;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
      display: inline-block;
      transition: background .15s ease;
    }

    .game a:hover {
      background: #45a049;
    }

    /* Pagination */
    #pagination {
      margin-top: 30px;
    }

    #pagination button {
      padding: 12px 20px;
      margin: 0 10px;
      background: #333;
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      transition: background .15s ease;
    }

    #pagination button:hover {
      background: #555;
    }
  </style>
</head>

<body>
  <h1>My Games</h1>

  <div id="game-list">Loading games…</div>

  <div id="pagination"></div>

  <script src="games.js"></script>
</body>
</html>
