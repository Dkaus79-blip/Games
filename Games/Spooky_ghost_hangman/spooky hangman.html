<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Spooky Ghost Hangman</title>
<style>
    :root {
        --bg-main: #050509;
        --bg-panel: #11131b;
        --accent: #6cf0ff;
        --accent-soft: rgba(108, 240, 255, 0.4);
        --text-main: #f5f5f5;
        --text-muted: #a0a4b8;
        --danger: #ff3b3b;
        --success: #7bff7b;

        --font-large: 32px;
        --font-medium: 20px;
        --font-small: 16px;
        --font-tiny: 13px;
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: radial-gradient(circle at top, #20263a 0, #050509 55%);
        color: var(--text-main);
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
    }

    h1 {
        margin-top: 18px;
        margin-bottom: 4px;
        text-shadow: 0 0 12px var(--accent);
        letter-spacing: 2px;
        font-size: var(--font-large);
    }

    #subtitle {
        font-size: var(--font-small);
        color: var(--text-muted);
        margin-bottom: 10px;
    }

    #game-container {
        margin-top: 10px;
        padding: 18px;
        border-radius: 12px;
        background: radial-gradient(circle at top left, #1b2135 0, #050509 70%);
        box-shadow: 0 0 24px rgba(0,0,0,0.9);
        display: flex;
        flex-direction: row;
        gap: 24px;
        max-width: 980px;
        width: 100%;
        justify-content: center;
    }

    #left-panel, #right-panel {
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    #left-panel { min-width: 420px; }
    #right-panel { min-width: 260px; }

    #category-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
        font-size: var(--font-small);
    }

    #category-label {
        color: var(--text-muted);
    }

    #category-icon {
        font-size: 22px;
    }

    #category-select {
        background: #151827;
        color: var(--text-main);
        border-radius: 6px;
        border: 1px solid #2b3045;
        padding: 6px 10px;
        font-size: var(--font-small);
        outline: none;
    }

    #category-select:focus {
        border-color: var(--accent);
        box-shadow: 0 0 6px var(--accent-soft);
    }

    #word-display {
        font-size: 30px;
        letter-spacing: 10px;
        margin: 16px 0 10px 0;
        text-align: center;
        min-height: 44px;
    }

    #hint-row {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: var(--font-tiny);
        color: var(--text-muted);
        margin-bottom: 8px;
    }

    #hint-btn {
        padding: 4px 10px;
        border-radius: 6px;
        border: 1px solid #2b3045;
        background: #151827;
        color: var(--text-main);
        font-size: var(--font-tiny);
        cursor: pointer;
    }

    #hint-btn:hover:not(:disabled) {
        border-color: var(--accent);
        box-shadow: 0 0 6px var(--accent-soft);
    }

    #hint-btn:disabled {
        opacity: 0.4;
        cursor: default;
    }

    #letters {
        display: grid;
        grid-template-columns: repeat(13, 1fr);
        gap: 5px;
        max-width: 520px;
        margin-top: 6px;
    }

    #letters button {
        padding: 7px 0;
        border-radius: 4px;
        border: 1px solid #2b3045;
        background: #151827;
        color: #e0e4ff;
        cursor: pointer;
        font-size: var(--font-small);
        transition: background 0.15s, transform 0.08s, box-shadow 0.15s;
    }

    #letters button:hover:not(:disabled) {
        background: #1f2335;
        transform: translateY(-1px);
        box-shadow: 0 0 6px rgba(0,0,0,0.7);
    }

    #letters button:disabled {
        background: #090b12;
        color: #555a70;
        border-color: #151827;
        cursor: default;
        transform: none;
        box-shadow: none;
    }

    #status {
        margin-top: 10px;
        min-height: 24px;
        font-size: var(--font-medium);
        text-align: center;
    }

    #status.win { color: var(--success); }
    #status.lose { color: var(--danger); }

    #controls {
        margin-top: 10px;
        display: flex;
        gap: 8px;
    }

    #controls button {
        padding: 6px 12px;
        border-radius: 6px;
        border: 1px solid #2b3045;
        background: #151827;
        color: var(--text-main);
        cursor: pointer;
        font-size: var(--font-small);
    }

    #controls button:hover {
        border-color: var(--accent);
        box-shadow: 0 0 6px var(--accent-soft);
    }

    #lives-row {
        margin-top: 8px;
        font-size: var(--font-tiny);
        color: var(--text-muted);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
    }

    #lives-orbs {
        display: flex;
        gap: 4px;
    }

    .orb {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #1b2135;
        box-shadow: 0 0 4px rgba(0,0,0,0.8);
        border: 1px solid #2b3045;
    }

    .orb.active {
        background: var(--accent);
        box-shadow: 0 0 8px var(--accent-soft);
    }

    #ghost-panel-title {
        font-size: var(--font-small);
        color: var(--text-muted);
        margin-bottom: 6px;
    }

    #ghost-area {
        position: relative;
        width: 240px;
        height: 280px;
        margin-bottom: 6px;
        border-radius: 16px;
        background: radial-gradient(circle at top, #1b2135 0, #050509 70%);
        box-shadow: 0 0 18px rgba(0,0,0,0.9);
        overflow: hidden;
    }

    .shake {
        animation: shake 0.25s;
    }

    @keyframes shake {
        0% { transform: translateX(0); }
        20% { transform: translateX(-6px); }
        40% { transform: translateX(6px); }
        60% { transform: translateX(-4px); }
        80% { transform: translateX(4px); }
        100% { transform: translateX(0); }
    }

    #ghost {
        position: absolute;
        left: 50%;
        top: 46%;
        transform: translate(-50%, -50%);
        width: 130px;
        height: 160px;
        background: #ffffff;
        border-radius: 70px 70px 50px 50px;
        box-shadow: 0 0 20px rgba(255,255,255,0.8);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: transform 0.25s, filter 0.25s;
    }

    #ghost-face {
        width: 70%;
        height: 55%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    .eyes {
        display: flex;
        justify-content: space-between;
        width: 70%;
        margin-bottom: 10px;
    }

    .eye {
        width: 18px;
        height: 24px;
        background: #000;
        border-radius: 50%;
        transition: width 0.2s, height 0.2s;
    }

    .eye.small { height: 16px; }
    .eye.wide { height: 28px; width: 20px; }

    #mouth {
        width: 44px;
        height: 20px;
        border-radius: 0 0 40px 40px;
        border-bottom: 5px solid #000;
        transition: all 0.25s;
    }

    .mouth-worried {
        border-bottom: none;
        border-top: 5px solid #000;
        border-radius: 40px;
    }

    .mouth-scared {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: #000;
        border: none;
    }

    #ghost-tail {
        position: absolute;
        bottom: -20px;
        left: 50%;
        transform: translateX(-50%);
        width: 90px;
        height: 45px;
        background: #ffffff;
        border-radius: 50%;
        box-shadow: 0 0 15px rgba(255,255,255,0.7);
    }

    .ghost-stage-0 { transform: translate(-50%, -50%) translateY(0); }
    .ghost-stage-1 { transform: translate(-50%, -50%) translateY(2px); }
    .ghost-stage-2 { transform: translate(-50%, -50%) translateY(4px); }
    .ghost-stage-3 { transform: translate(-50%, -50%) translateY(6px); }
    .ghost-stage-4 { transform: translate(-50%, -50%) translateY(8px); }
    .ghost-stage-5 { transform: translate(-50%, -50%) translateY(10px); }
    .ghost-stage-6 { transform: translate(-50%, -50%) translateY(12px); }
    .ghost-stage-7 { transform: translate(-50%, -50%) translateY(14px); }
    .ghost-stage-8 { transform: translate(-50%, -50%) translateY(16px); }
    .ghost-stage-9 { transform: translate(-50%, -50%) translateY(18px); }
    .ghost-stage-10 { transform: translate(-50%, -50%) translateY(20px); filter: brightness(0.85); }

    .ghost-escape {
        animation: ghostEscape 1s forwards;
    }
    @keyframes ghostEscape {
        0% { transform: translate(-50%, -50%); opacity: 1; }
        40% { transform: translate(-50%, -80%); opacity: 1; }
        100% { transform: translate(-50%, -140%); opacity: 0; }
    }

    .ghost-captured {
        animation: ghostCaptured 0.4s forwards;
    }
    @keyframes ghostCaptured {
        0% { transform: translate(-50%, -50%); }
        60% { transform: translate(-50%, -40%); }
        100% { transform: translate(-50%, -50%); }
    }

    .bar {
        position: absolute;
        background: radial-gradient(circle, #9af7ff 0, #4ad0ff 40%, #1a3a4f 100%);
        box-shadow: 0 0 12px rgba(108, 240, 255, 0.9);
        opacity: 0;
        transform: scaleY(0.4);
        transition: opacity 0.25s, transform 0.25s;
    }

    .bar.visible {
        opacity: 1;
        transform: scaleY(1);
    }

    #bar1 { left: 30px; top: 20px; width: 12px; height: 230px; }
    #bar2 { left: 70px; top: 20px; width: 12px; height: 230px; }
    #bar3 { left: 110px; top: 20px; width: 12px; height: 230px; }
    #bar4 { left: 150px; top: 20px; width: 12px; height: 230px; }
    #bar5 { left: 190px; top: 20px; width: 12px; height: 230px; }

    #bar6 { left: 25px; top: 10px; width: 180px; height: 12px; }
    #bar7 { left: 25px; bottom: 10px; width: 180px; height: 12px; }

    #bar8 { left: 18px; top: 10px; width: 10px; height: 230px; }
    #bar9 { right: 18px; top: 10px; width: 10px; height: 230px; }

    #bar10 {
        left: 25px;
        top: 130px;
        width: 180px;
        height: 10px;
        box-shadow: 0 0 16px rgba(255, 0, 0, 0.9);
    }

    .slam {
        animation: slamBar 0.25s;
    }
    @keyframes slamBar {
        0% { transform: translateY(-40px); opacity: 0; }
        80% { transform: translateY(0); opacity: 1; }
        100% { transform: translateY(0); opacity: 1; }
    }

    #ghost-status-text {
        font-size: var(--font-tiny);
        color: var(--text-muted);
        text-align: center;
        min-height: 18px;
    }

    #footer-note {
        margin-top: 8px;
        font-size: var(--font-tiny);
        color: var(--text-muted);
        text-align: center;
    }

    @media (max-width: 860px) {
        #game-container {
            flex-direction: column;
            align-items: center;
        }
        #left-panel, #right-panel {
            min-width: 0;
        }
    }
</style>
</head>
<body>
<h1>Spooky Ghost Hangman</h1>
<div id="subtitle">catch the ghost in a magical cage… or let it escape!</div>

<div id="game-container">
    <div id="left-panel">
        <div id="category-row">
            <span id="category-label">category:</span>
            <span id="category-icon">🐾</span>
            <select id="category-select"></select>
        </div>

        <div id="word-display">_ _ _ _</div>

        <div id="hint-row">
            <button id="hint-btn">hint</button>
            <span id="hint-info">(one free letter per word)</span>
        </div>

        <div id="letters"></div>

        <div id="status"></div>

        <div id="controls">
            <button id="new-word-btn">new word</button>
            <button id="reveal-btn">reveal</button>
        </div>

        <div id="lives-row">
            <div id="lives-text">wrong guesses: 0 / 10</div>
            <div id="lives-orbs"></div>
        </div>
    </div>

    <div id="right-panel">
        <div id="ghost-panel-title">ghost cage</div>
        <div id="ghost-area">
            <div id="bar1" class="bar"></div>
            <div id="bar2" class="bar"></div>
            <div id="bar3" class="bar"></div>
            <div id="bar4" class="bar"></div>
            <div id="bar5" class="bar"></div>
            <div id="bar6" class="bar"></div>
            <div id="bar7" class="bar"></div>
            <div id="bar8" class="bar"></div>
            <div id="bar9" class="bar"></div>
            <div id="bar10" class="bar"></div>

            <div id="ghost">
                <div id="ghost-face">
                    <div class="eyes">
                        <div class="eye"></div>
                        <div class="eye"></div>
                    </div>
                    <div id="mouth"></div>
                </div>
                <div id="ghost-tail"></div>
            </div>
        </div>
        <div id="ghost-status-text">the ghost is calm… for now.</div>
    </div>
</div>

<div id="footer-note">tip: all words are lowercase. guess carefully to free the ghost!</div>

<script>
/* simple spooky beeps using Web Audio (no files needed) */
let audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        } catch (e) {
            audioCtx = null;
        }
    }
}
window.addEventListener("click", initAudio, { once: true });

function playTone(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === "correct") {
        osc.frequency.value = 880;
    } else if (type === "wrong") {
        osc.frequency.value = 220;
    } else if (type === "capture") {
        osc.frequency.value = 120;
    } else {
        osc.frequency.value = 440;
    }

    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);

    osc.start();
    osc.stop(audioCtx.currentTime + 0.25);
}

/* word lists */
const categories = {

        "doll","mimic","parasite","leech","batling","nightling","gloomling","lurker","watcher","whisperer",
        "screecher","howler","shrieker","crawlerling","nightwalker","graveborn","bonewalker","bloodsucker","fangling","shadekin"
    ],
    "haunted places": [
        "graveyard","cemetery","crypt","catacombs","mausoleum","chapel","churchyard","mansion","manor","castle",
        "dungeon","cellar","attic","basement","hallway","corridor","tunnel","cave","forest","swamp",
        "bog","marsh","cabin","shack","barn","lighthouse","asylum","hospital","schoolhouse","factory",
        "warehouse","theater","hotel","inn","tower","bridge","crossroads","well","mine","pit",
        "ruin","temple","shrine","courtyard","balcony","stairway","loft","chamber","cryptroom","darkroom"
    ],
    "magic & curses": [
        "magic","spell","charm","curse","hex","rune","sigil","glyph","ritual","potion",
        "elixir","scroll","wand","staff","crystal","orb","amulet","talisman","relic","totem",
        "summon","binding","sealing","enchant","invoke","channel","focus","aura","energy","spirit",
        "essence","blessing","ward","barrier","shield","spark","flame","frost","shadow","light",
        "dark","whisper","omen","prophecy","vision","trance","circle","mark","seal","chant"
    ],
    "horror words": [
        "fear","terror","panic","dread","nightmare","shadow","whisper","scream","blood","bone",
        "skull","claw","fang","bite","haunt","curse","doom","gloom","horror","fright",
        "danger","warning","silence","echo","chill","shiver","tremor","pulse","heartbeat","breath",
        "darkness","void","abyss","grave","tomb","coffin","corpse","spirit","soul","ritual",
        "omen","sign","threat","stalk","chase","hunt","trap","capture","vanish","lurking"
    ]
};

const categoryIcons = {
    "animals": "🐾",
    "food & snacks": "🍔",
    "everyday objects": "🔧",
    "places & locations": "🏠",
    "jobs & people": "👤",
    "fantasy creatures": "🐉",
    "spooky creatures": "👻",
    "haunted places": "🪦",
    "magic & curses": "✨",
    "horror words": "☠️"
};

let currentCategory = null;
let currentWord = "";
let guessedLetters = new Set();
let wrongGuesses = 0;
const maxWrong = 10;
let hintUsed = false;

const categorySelect = document.getElementById("category-select");
const categoryIconSpan = document.getElementById("category-icon");
const wordDisplay = document.getElementById("word-display");
const lettersDiv = document.getElementById("letters");
const statusDiv = document.getElementById("status");
const newWordBtn = document.getElementById("new-word-btn");
const revealBtn = document.getElementById("reveal-btn");
const ghostArea = document.getElementById("ghost-area");
const ghost = document.getElementById("ghost");
const mouth = document.getElementById("mouth");
const eyes = Array.from(document.querySelectorAll(".eye"));
const bars = Array.from(document.querySelectorAll(".bar"));
const ghostStatusText = document.getElementById("ghost-status-text");
const livesText = document.getElementById("lives-text");
const livesOrbs = document.getElementById("lives-orbs");
const hintBtn = document.getElementById("hint-btn");

function initCategories() {
    Object.keys(categories).forEach(cat => {
        const opt = document.createElement("option");
        opt.value = cat;
        opt.textContent = cat;
        categorySelect.appendChild(opt);
    });
    currentCategory = categorySelect.value;
    updateCategoryIcon();
}

function updateCategoryIcon() {
    categoryIconSpan.textContent = categoryIcons[currentCategory] || "❓";
}

function initLetters() {
    const alphabet = "abcdefghijklmnopqrstuvwxyz";
    lettersDiv.innerHTML = "";
    for (let ch of alphabet) {
        const btn = document.createElement("button");
        btn.textContent = ch;
        btn.dataset.letter = ch;
        btn.addEventListener("click", () => handleGuess(ch));
        lettersDiv.appendChild(btn);
    }
}

function initLivesOrbs() {
    livesOrbs.innerHTML = "";
    for (let i = 0; i < maxWrong; i++) {
        const orb = document.createElement("div");
        orb.className = "orb";
        livesOrbs.appendChild(orb);
    }
}

function pickNewWord() {
    currentCategory = categorySelect.value;
    updateCategoryIcon();
    const words = categories[currentCategory];
    currentWord = words[Math.floor(Math.random() * words.length)];
    guessedLetters.clear();
    wrongGuesses = 0;
    hintUsed = false;
    hintBtn.disabled = false;

    updateWordDisplay();
    updateBars();
    updateGhostFace();
    updateGhostStage();
    updateLivesInfo();

    statusDiv.textContent = "guess the word!";
    statusDiv.className = "";
    ghostStatusText.textContent = "the ghost is calm… for now.";

    enableAllLetters();
    ghost.classList.remove("ghost-escape","ghost-captured");
}

function updateWordDisplay() {
    let display = "";
    for (let ch of currentWord) {
        if (ch === " ") display += "  ";
        else if (guessedLetters.has(ch)) display += ch + " ";
        else display += "_ ";
    }
    wordDisplay.textContent = display.trim();
}

function enableAllLetters() {
    lettersDiv.querySelectorAll("button").forEach(b => b.disabled = false);
}
function disableAllLetters() {
    lettersDiv.querySelectorAll("button").forEach(b => b.disabled = true);
}

function updateBars() {
    bars.forEach((bar, index) => {
        if (index < wrongGuesses) bar.classList.add("visible");
        else bar.classList.remove("visible");
    });

    if (wrongGuesses === maxWrong) {
        const lastBar = document.getElementById("bar10");
        lastBar.classList.add("slam");
        setTimeout(() => lastBar.classList.remove("slam"), 300);
    }
}

function updateGhostStage() {
    for (let i = 0; i <= maxWrong; i++) {
        ghost.classList.remove("ghost-stage-" + i);
    }
    ghost.classList.add("ghost-stage-" + Math.min(wrongGuesses, maxWrong));
}

function updateGhostFace() {
    mouth.className = "";
    eyes.forEach(e => e.classList.remove("small","wide"));

    const ratio = wrongGuesses / maxWrong;

    if (ratio === 0) {
        ghostStatusText.textContent = "the ghost is calm… for now.";
    } else if (ratio <= 0.2) {
        mouth.classList.add("mouth-worried");
        ghostStatusText.textContent = "the ghost looks a little worried.";
    } else if (ratio <= 0.4) {
        mouth.classList.add("mouth-worried");
        eyes.forEach(e => e.classList.add("small"));
        ghostStatusText.textContent = "the ghost is getting nervous.";
    } else if (ratio <= 0.6) {
        mouth.classList.add("mouth-worried");
        eyes.forEach(e => e.classList.add("wide"));
        ghostStatusText.textContent = "the ghost is scared!";
    } else if (ratio < 1) {
        mouth.classList.add("mouth-scared");
        eyes.forEach(e => e.classList.add("wide"));
        ghostStatusText.textContent = "the ghost is panicking!";
    } else {
        mouth.classList.add("mouth-scared");
        eyes.forEach(e => e.classList.add("wide"));
        ghostStatusText.textContent = "the ghost is trapped!";
    }
}

function screenShake() {
    ghostArea.classList.remove("shake");
    void ghostArea.offsetWidth;
    ghostArea.classList.add("shake");
    setTimeout(() => ghostArea.classList.remove("shake"), 260);
}

function handleGuess(letter) {
    const btn = [...lettersDiv.children].find(b => b.dataset.letter === letter);
    if (btn) btn.disabled = true;

    if (currentWord.includes(letter)) {
        guessedLetters.add(letter);
        updateWordDisplay();
        playTone("correct");

        if (checkWin()) {
            statusDiv.textContent = "you freed the ghost!";
            statusDiv.className = "win";
            disableAllLetters();
            ghost.classList.add("ghost-escape");
            ghostStatusText.textContent = "the ghost escapes into the night!";
        }
    } else {
        wrongGuesses++;
        updateBars();
        updateGhostFace();
        updateGhostStage();
        screenShake();

        if (wrongGuesses >= maxWrong) playTone("capture");
        else playTone("wrong");

        updateLivesInfo();

        if (wrongGuesses >= maxWrong) {
            statusDiv.textContent = "the ghost is trapped! the word was: " + currentWord;
            statusDiv.className = "lose";
            disableAllLetters();
            ghost.classList.add("ghost-captured");
        }
    }
}

function checkWin() {
    for (let ch of currentWord) {
        if (ch !== " " && !guessedLetters.has(ch)) return false;
    }
    return true;
}

function updateLivesInfo() {
    const remaining = Math.max(0, maxWrong - wrongGuesses);
    livesText.textContent = "wrong guesses: " + wrongGuesses + " / " + maxWrong;

    const orbs = livesOrbs.querySelectorAll(".orb");
    orbs.forEach((orb, index) => {
        if (index < remaining) orb.classList.add("active");
        else orb.classList.remove("active");
    });
}

function useHint() {
    if (hintUsed) return;

    const unrevealed = [];
    for (let ch of currentWord) {
        if (ch !== " " && !guessedLetters.has(ch)) unrevealed.push(ch);
    }
    if (unrevealed.length === 0) return;

    const letter = unrevealed[Math.floor(Math.random() * unrevealed.length)];
    guessedLetters.add(letter);
    hintUsed = true;
    hintBtn.disabled = true;

    updateWordDisplay();
    statusDiv.textContent = "hint used: letter '" + letter + "' revealed.";

    if (checkWin()) {
        statusDiv.textContent = "you freed the ghost!";
        statusDiv.className = "win";
        disableAllLetters();
        ghost.classList.add("ghost-escape");
        ghostStatusText.textContent = "the ghost escapes into the night!";
    }
}

newWordBtn.addEventListener("click", pickNewWord);
revealBtn.addEventListener("click", () => {
    statusDiv.textContent = "revealed: " + currentWord;
    disableAllLetters();
});
categorySelect.addEventListener("change", pickNewWord);
hintBtn.addEventListener("click", useHint);

initCategories();
initLetters();
initLivesOrbs();
pickNewWord();
</script>
</body>
</html>
